<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ระบบเดินรถพิษณุโลก</title>
  <script>
    // ตั้งธีมก่อนวาดหน้า กันจอกระพริบสว่าง→มืด (key ตรงกับ js/lib/theme.js)
    (function () {
      var t = null;
      try { t = localStorage.getItem('bus-theme'); } catch (e) { /* ใช้ค่าตามระบบ */ }
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <header class="app-header" id="header"></header>

  <main class="app-main" id="appMain">
    <section class="map-area" aria-label="แผนที่">
      <div id="map" class="map"></div>
      <div id="alertBar" class="alert-bar" role="alert" hidden></div>
      <div id="stationCard" class="station-card" hidden></div>
      <div id="riderSheet" class="rider-sheet" aria-label="ข้อมูลรถสำหรับผู้โดยสาร"><button class="sheet-handle" data-act="sheetCycle" aria-label="ลากหรือแตะเพื่อปรับความสูงแผ่นข้อมูล"><i></i></button></div>
      <section class="log-drawer ctl-only" aria-label="บันทึกเหตุการณ์">
        <button class="log-bar" id="logBar" data-act="logToggle" aria-controls="eventLog"></button>
        <div class="log-body"><div id="eventLog" class="event-log" aria-live="polite"></div></div>
      </section>
      <button class="panel-toggle ctl-only" id="panelToggle" data-act="panelToggle" aria-controls="controlPanel"></button>
    </section>

    <aside class="panel" id="controlPanel" aria-label="แผงควบคุม">
      <button class="sheet-handle" data-act="sheetCycle" aria-label="ลากหรือแตะเพื่อปรับความสูงแผ่นข้อมูล"><i></i></button>
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <div class="panel-body" id="panelBody"></div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
